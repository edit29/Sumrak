<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141a22">
    <title>Нет подключения — Сумрак</title>
    <script>try{if(localStorage.getItem('sumrak-theme')==='dark')document.documentElement.dataset.theme='dark'}catch{}</script>
    <style>
      :root { color-scheme: light; --bg: #f3f5f8; --ink: #141a22; --link: #3a4fd8; }
      :root[data-theme="dark"] { color-scheme: dark; --bg: #0e1319; --ink: #eef2f7; --link: #8c9bff; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      main { max-width: 28rem; }
      a { color: var(--link); }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет подключения к интернету</h1>
      <p>Проверьте соединение и попробуйте открыть страницу снова.</p>
      <a href="/">На главную</a>
    </main>
  </body>
</html>
